<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <h1>Inventario</h1>
    <div class="botones">
      <button id="signIn">Sign In</button>
      <button id="signOut">Log out</button>
      <p id="token"></p>
    </div>

    <form action="">
      <label for="idUsuario">ID Usuario</label>
      <input type="text" id="idUsuario" name="idUsuario" />
      <label for="idItem">ID ítem</label>
      <input type="text" id="idItem" name="idItem" />
      <label for="descripcion">Descripción</label>
      <input type="text" id="descripcion" name="descripcion" />
      <label for="categoria">Categoría</label>
      <input type="text" id="categoria" name="categoria" />
      <button type="submit">Añadir</button>
    </form>
    <div class="items">
      <h2>Items</h2>
      <table>
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Item</th>
            <th>Descripción</th>
            <th>Categoría</th>
          </tr>
        </thead>
        <tbody id="listaItems"></tbody>
      </table>
    </div>
    <script type="module" src="/src/index.js"></script>
    <script type="module">
      import { userManager, signOutRedirect } from '/src/main.js'

      document.getElementById('signIn').addEventListener('click', async () => {
        await userManager.signinRedirect()
      })

      document.getElementById('signOut').addEventListener('click', async () => {
        sessionStorage.clear()
        await signOutRedirect()
      })
    </script>
  </body>
</html>
